<!doctype html>
<!--
  The picture shown when a link to the website is shared (Discord, Reddit, X...): web/public/og-card.png, 1200 x 630.
  Render it again after changing this file, from web/:
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless --hide-scrollbars --force-device-scale-factor=1
      --window-size=1200,630 --screenshot="%CD%\public\og-card.png" "file:///%CD%/scripts/og-card.html"
  It needs the fonts in node_modules (npm install first).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Luckiest Guy";
        src: url("../node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 800;
        src: url("../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 80px;
        box-sizing: border-box;
        color: #fff;
        font-family: "Nunito", sans-serif;
        background:
          radial-gradient(circle at 18% 50%, rgba(74, 142, 230, 0.45), transparent 42%),
          linear-gradient(180deg, #06152b 0%, #0c2a52 60%, #12396b 100%);
      }
      .logo {
        flex: none;
        width: 300px;
        height: 300px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.55));
      }
      h1 {
        margin: 0;
        font: 400 92px/1 "Luckiest Guy", sans-serif;
        letter-spacing: 1px;
        text-shadow:
          0 5px 0 #0b1d38,
          0 0 6px #0b1d38;
      }
      p {
        margin: 22px 0 30px;
        font-size: 38px;
        font-weight: 800;
        color: #eaf3ff;
      }
      .chips {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .chip {
        font: 400 30px/1 "Luckiest Guy", sans-serif;
        padding: 14px 22px 10px;
        border-radius: 16px;
        border: 4px solid #0b1d38;
        text-shadow: 0 3px 0 #0b1d38;
        background: linear-gradient(180deg, #8de65a, #74d33c);
        box-shadow: inset 0 -6px 0 #3f8f17;
      }
      .chip.orange {
        background: linear-gradient(180deg, #ffab52, #ff8a1f);
        box-shadow: inset 0 -6px 0 #b65400;
      }
      .chip.blue {
        background: linear-gradient(180deg, #6fd2ff, #2fb7f5);
        box-shadow: inset 0 -6px 0 #12709c;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../public/icon.png" alt="" />
    <div>
      <h1>Custom Boss<br />Challenge</h1>
      <p>Build your own BTD6 boss fight</p>
      <div class="chips">
        <span class="chip">Any boss</span>
        <span class="chip orange">1–10 tiers</span>
        <span class="chip blue">Share codes</span>
      </div>
    </div>
  </body>
</html>
