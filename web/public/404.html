<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Custom Boss Challenge</title>
    <!--
      GitHub Pages shows this page for any address that doesn't exist, at any depth, so it can't rely on relative paths
      to the site's files: everything it needs is inline, and the way home is worked out from the address.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
        background: linear-gradient(180deg, #06152b 0%, #0c2a52 60%, #12396b 100%) fixed;
        text-align: center;
      }
      .panel {
        max-width: 480px;
        background: #4a8ee6;
        border: 4px solid #1d4f94;
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.3),
          0 0 0 3px #0b1d38,
          0 8px 0 3px rgba(0, 0, 0, 0.45);
      }
      .skull {
        font-size: 64px;
        line-height: 1;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 2rem;
        text-shadow: 0 2px 0 #0b1d38;
      }
      p {
        margin: 0 0 20px;
        text-shadow: 0 1px 0 rgba(11, 29, 56, 0.6);
      }
      a {
        display: inline-block;
        border: 3px solid #0b1d38;
        border-radius: 14px;
        padding: 0.55em 1.1em;
        font-weight: 800;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(180deg, #8de65a, #74d33c);
        box-shadow:
          inset 0 -5px 0 #3f8f17,
          0 3px 0 #0b1d38;
      }
      a:focus-visible {
        outline: 3px solid #ffd84d;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="skull" aria-hidden="true">💀</div>
      <h1>This page got popped</h1>
      <p>There's nothing here. The boss must have taken it.</p>
      <a id="home" href="/">Back to Custom Boss Challenge</a>
    </main>
    <script>
      // On GitHub Pages the site lives under /<repository>/, so home is the first folder of the address
      if (location.hostname.endsWith("github.io")) {
        var folder = location.pathname.split("/")[1];
        if (folder) document.getElementById("home").href = "/" + folder + "/";
      }
    </script>
  </body>
</html>
