# Publishes the website in web/ to GitHub Pages (https://pedersebastian.github.io/CustomBossChallenge/) when master
# changes it, with boss-events.json built from data/boss-events/ next to it. boss-events.yml calls it after archiving
# new events, since its commits don't start other workflows. Settings > Pages must have GitHub Actions as its source.
# Not generated by Mod Helper, so changes are kept.
name: Website

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - 'data/boss-events/**'
      - 'tools/boss-events/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

# Each job gets what it needs: only the deploy job can write to Pages or get an OIDC token, not npm ci and the build
permissions: {}

# One deployment at a time, and a newer push replaces one that hasn't started yet
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Test that the website reads codes like the mod
        run: npm test

      # Called by boss-events.yml, the checkout is the commit before the archiver's own. Only the data is taken from
      # the newest master, never code, so nothing that runs here comes from another commit. :/ is the repository root,
      # since this job runs in web/.
      - name: Use the newest boss events archive on master
        run: |
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD -- :/data/boss-events

      - name: Build boss-events.json from the boss events archive
        run: node ../tools/boss-events/archive.mjs --bundle public/boss-events.json

      - name: Build the website
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
