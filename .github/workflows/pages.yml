# Publishes the website in web/ to GitHub Pages (https://pedersebastian.github.io/CustomBossChallenge/) when master
# changes it. Settings > Pages must have GitHub Actions as its source. Not generated by Mod Helper, so changes are kept.
name: Website

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push replaces one that hasn't started yet
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Test that the website reads codes like the mod
        run: npm test

      - name: Build the website
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
