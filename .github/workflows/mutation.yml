# Mutation testing (#268): finds code the tests run but don't really check. Stryker changes the code a little at a time
# (a "mutant", e.g. < to <=) and runs the tests; a mutant no test fails on has "survived". Slow, so not on every PR: run
# it by hand, or let the weekly run show how the score moves. Each job uploads its HTML report as an artifact; it never
# fails on a low score. The last job compares the scores with the run before and says on an issue when a file has new
# survivors.
# How to run it locally: CONTRIBUTING.md.
name: Mutation tests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 0'

permissions:
  contents: read

jobs:
  website:
    name: Share code and preview (Stryker)
    runs-on: ubuntu-latest
    # About 1.5 hours on a fast PC; Stryker writes the report only at the end, so a run cut short has none
    timeout-minutes: 180
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Mutate the share-code package and the preview math
        run: npm run mutation

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-website
          path: web/reports/mutation/
          if-no-files-found: warn

  config-math:
    name: Config math (Stryker.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-stryker (Shared/.config/dotnet-tools.json)
        working-directory: Shared
        run: dotnet tool restore

      - name: Mutate the math in Config/, checked by UnitTests and PropertyTests
        working-directory: Shared
        run: dotnet stryker --output "$GITHUB_WORKSPACE/StrykerOutput"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-config-math
          path: StrykerOutput/reports/
          if-no-files-found: warn

  compare:
    name: Compare with the run before
    needs: [website, config-math]
    # Also after a job failed: the other part still has a report
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads this run's and the last run's reports, writes only the one issue
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Mutation score dropped
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          path: current/

      # The last run on master that finished: a run still going, failed or cancelled has no reports to trust
      - name: Download the reports of the run before
        run: |
          previous=$(gh run list --workflow mutation.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          if [ -n "$previous" ]; then gh run download "$previous" --dir previous/ || echo "Its reports have expired"; fi

      - name: Compare the scores
        run: python3 .github/scripts/Compare-Mutation.py --current current --previous previous --summary "$GITHUB_STEP_SUMMARY" --drop drop.md

      # Only for master: a run by hand on another branch shows the table but opens no issue
      - name: Open or update the issue
        if: github.ref == 'refs/heads/master' && hashFiles('drop.md') != ''
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The [mutation run]($run_url) on ${GITHUB_SHA::7} has survivors that are new, compared with [the run before]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS)."
            echo "The full table is in the run's summary, the reports are its artifacts. For each survivor: add a test that fails on it, or leave it when it changes nothing (CONTRIBUTING.md, Mutation tests)."
            echo
            cat drop.md
          } | head -c 60000 > body.md  # an issue comment holds at most 65536 characters
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then gh issue comment "$number" --body-file body.md; else gh issue create --title "$TITLE" --body-file body.md; fi
