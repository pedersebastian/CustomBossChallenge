# Builds the mod on every push and pull request, and releases it for a tag (or a run by hand with a tag): to
# Thunderstore and as a GitHub release. Mod Helper wrote the first version of this file; GenerateActionsWorkflow is
# false in the csproj, so it no longer writes it again, and the changes here are kept:
# - a release runs checks.yml first and is only built, published and released when every check passes;
# - everything the build downloads is pinned. MelonLoader and Mod Helper are the minimum versions thunderstore.toml
#   promises, so the DLL is built against what it says it needs; the game's assemblies are the ci-dependencies commit
#   below. The job summary and the release notes say what was used. See CONTRIBUTING.md for when to bump them;
# - third-party actions are pinned to a commit, with the version in a comment, which Dependabot keeps up to date;
# - values from outside (the tag, the description) reach run: scripts only through env, never through ${{ }};
# - the GitHub release is made before Thunderstore, and a CHANGELOG that can't be pushed fails the release;
# - only the release job can write to the repository. It packs the DLL the build job made, with the other package
#   files from the same tagged commit, and the checks only let a commit on the default branch be released.
name: Build

on:
  push:
    # '**' also matches branch names with a /, which '*' doesn't
    branches:
      - '**'
    tags:
      - '*'
  # Never a release: IS_RELEASE is false, so nothing is published
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release (e.g. 1.0.0), leave empty to check mod builds without pushing any new release.'
        required: false
        type: string
      description:
        description: "Description of new release, if you haven't already changed CHANGELOG.md/LATEST.md."
        required: false
        type: string

env:
  PROJECT_NAME: CustomBossChallenge
  DLL_NAME: CustomBossChallenge.dll

  BLOONSTD6: ./BloonsTD6
  MOD_HELPER_NAME: Btd6ModHelper
  MOD_HELPER_REPO: gurrenm3/BTD-Mod-Helper

  # The game's assemblies to build against: a commit of doombubbles/btd6-ci-dependencies ("Update for v57.2")
  CI_DEPENDENCIES_REF: 44ebfc0bb0c779557b4db25442dcba90ddc96de8

  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
  RELEASE_DESC: ${{ inputs.description || '' }}

jobs:
  # Only for a release; a job's if can't read env, so this is IS_RELEASE written out
  checks:
    name: Checks
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  # Builds the DLL with a read-only token, also for a release; the release job packs and publishes it
  build:
    # Runs when the checks passed, or were skipped because this isn't a release
    needs: checks
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      built-with: ${{ steps.built_with.outputs.text }}

    steps:
      - name: Clone Repo
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJECT_NAME }}

      - name: Read the minimum MelonLoader and Mod Helper from thunderstore.toml
        working-directory: ${{ env.PROJECT_NAME }}
        run: |
          melonloader=$(sed -n 's/^LavaGang-MelonLoader *= *"\([^"]*\)".*/\1/p' thunderstore.toml)
          modhelper=$(sed -n 's/^doombubbles-Btd6ModHelper *= *"\([^"]*\)".*/\1/p' thunderstore.toml)
          if [ -z "$melonloader" ] || [ -z "$modhelper" ]; then
            echo "::error file=thunderstore.toml::no LavaGang-MelonLoader or doombubbles-Btd6ModHelper version found"
            exit 1
          fi
          echo "MELONLOADER_VERSION=$melonloader" >> "$GITHUB_ENV"
          echo "MOD_HELPER_VERSION=$modhelper" >> "$GITHUB_ENV"

      - name: Download MelonLoader Release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: LavaGang/MelonLoader
          fileName: MelonLoader.x64.zip
          tag: v${{ env.MELONLOADER_VERSION }}
          extract: true
          extract-path: ${{ env.BLOONSTD6 }}

      - name: Clone Dependencies Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: doombubbles/btd6-ci-dependencies
          ref: ${{ env.CI_DEPENDENCIES_REF }}
          path: ${{ env.BLOONSTD6 }}/MelonLoader/Il2CppAssemblies

      - name: Download Mod Helper
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        if: env.MOD_HELPER_BRANCH == ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.MOD_HELPER_REPO }}
          fileName: ${{ env.MOD_HELPER_NAME }}.dll
          out-file-path: ${{ env.BLOONSTD6 }}/Mods/
          tag: ${{ env.MOD_HELPER_VERSION }}

      - name: Download Specific Mod Helper
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        if: env.MOD_HELPER_BRANCH != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: ${{ env.MOD_HELPER_NAME }}.dll
          branch: ${{ env.MOD_HELPER_BRANCH }}
          repo: ${{ env.MOD_HELPER_REPO }}
          path: ${{ env.BLOONSTD6 }}/Mods/

      - name: Download btd6.targets
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            choco install -y wget
          fi
          wget "https://raw.githubusercontent.com/$MOD_HELPER_REPO/$MOD_HELPER_VERSION/BloonsTD6%20Mod%20Helper/btd6.targets"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release -p:BloonsTD6="../$BLOONSTD6" "$PROJECT_NAME/$PROJECT_NAME.csproj"

      - name: Say what the mod was built with
        id: built_with
        env:
          DEPENDENCIES_PATH: ${{ env.BLOONSTD6 }}/MelonLoader/Il2CppAssemblies
        run: |
          game=$(git -C "$DEPENDENCIES_PATH" log -1 --format=%s)
          sha=$(git -C "$DEPENDENCIES_PATH" rev-parse --short HEAD)
          {
            echo "### Built with"
            echo ""
            echo "| What | Version |"
            echo "|---|---|"
            echo "| MelonLoader | $MELONLOADER_VERSION |"
            echo "| Mod Helper (and btd6.targets) | $MOD_HELPER_VERSION |"
            echo "| Game assemblies (btd6-ci-dependencies) | $sha: $game |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "text=Built with MelonLoader $MELONLOADER_VERSION and Mod Helper $MOD_HELPER_VERSION, against the game's assemblies from btd6-ci-dependencies $sha ($game)." >> "$GITHUB_OUTPUT"

      - name: Upload Mod DLL
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DLL_NAME }}
          path: ${{ env.BLOONSTD6 }}/Mods/${{ env.DLL_NAME }}

  # Only for a release, once the checks and the build passed; the only job that can write to the repository. Every file
  # it packs comes from the tagged commit: the DLL from the build job, the rest from its own checkout. One release at a
  # time, so two runs for the same tag can't race on the CHANGELOG push.
  release:
    name: Release
    needs: [checks, build]
    if: needs.checks.result == 'success' && needs.build.result == 'success'
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJECT_NAME }}

      - name: Download Mod DLL
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DLL_NAME }}
          path: ${{ env.PROJECT_NAME }}/bin/Release

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Process description input
        if: env.RELEASE_DESC != ''
        working-directory: ${{ env.PROJECT_NAME }}
        run: |
          perl -i -pe 's{^## \[Unreleased\]$}{"## [Unreleased]\n\n" . $ENV{RELEASE_DESC}}e' CHANGELOG.md

      - name: Check changelog for ${{ env.RELEASE_TAG }} section
        id: changelog_check
        working-directory: ${{ env.PROJECT_NAME }}
        run: |
          # The tag as plain text at the start of a line, not as a pattern
          if awk -v heading="## [$RELEASE_TAG]" 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "has_section=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read changelog entry for ${{ env.RELEASE_TAG }}
        id: changelog_read
        if: steps.changelog_check.outputs.has_section == 'true'
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ env.RELEASE_TAG }}
          path: ${{ env.PROJECT_NAME }}/CHANGELOG.md

      - name: Rotate changelog Unreleased section to ${{ env.RELEASE_TAG }}
        id: changelog_rotate
        if: steps.changelog_check.outputs.has_section != 'true' && env.ACT != 'true'
        uses: baynezy/ChangeLogger.Action@782ea8df5f0669e910de097106a6037147511d2d # 1.2.7.13
        with:
          tag: ${{ env.RELEASE_TAG }}
          log-path: ${{ env.PROJECT_NAME }}/CHANGELOG.md
          repo-path: ${{ env.PROJECT_NAME }}

      # Fails the release when the push fails, so the notes aren't left under "Unreleased" on the default branch. The
      # commit is made in a worktree of the default branch, so the package below is still made from the tagged commit.
      - name: Commit changelog changes if needed
        if: steps.changelog_rotate.outcome == 'success' && env.ACT != 'true'
        working-directory: ${{ env.PROJECT_NAME }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff -- CHANGELOG.md > "$RUNNER_TEMP/changelog.patch"
          git fetch origin "$DEFAULT_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/default-branch" FETCH_HEAD
          cd "$RUNNER_TEMP/default-branch"
          if [ -s "$RUNNER_TEMP/changelog.patch" ]; then git apply --3way "$RUNNER_TEMP/changelog.patch"; fi
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md on $DEFAULT_BRANCH is already up to date; nothing to commit."
          else
            git commit -m "Release $RELEASE_TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Install Thunderstore CLI
        run: |
          dotnet tool install -g tcli --version 0.2.4
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prepare README and icon for Thunderstore
        working-directory: ${{ env.PROJECT_NAME }}
        env:
          LINK_BASE: "https://github.com/${{ github.repository }}/blob/HEAD"
          IMAGE_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/HEAD"
          ICON_PATH: "Icon.png"
          SCRIPT: |
            import sharp from 'sharp';
            import fs from 'fs';

            const IMAGE_BASE = process.env.IMAGE_BASE;
            const LINK_BASE = process.env.LINK_BASE;
            const isAbsolute = (u) => /^(?:https?:)?\/\/|^\/|^mailto:|^data:/.test(u);
            const absolutize = (url, base) => {
              if (!url || isAbsolute(url) || url.startsWith('#')) return url;
              return `${base}/${url.replace(/^\.\//, '')}`;
            };

            let content = fs.readFileSync('README.md', 'utf8');

            // Remove sections that should not appear on Thunderstore
            content = content.replace(/<!-{2,}\s*THUNDERSTORE\s+EXCLUDE\s+START\s*-{2,}>[\s\S]*?<!-{2,}\s*THUNDERSTORE\s+EXCLUDE\s+END\s*-{2,}>/gi, '');

            // Remove <a href="….dll">…</a> download banners
            content = content.replace(/<a\b[^>]*\bhref=(["'])[^"']*\.dll\1[^>]*>[\s\S]*?<\/a>/gi, '');

            // Rewrite URLs to be absolute
            content = content
              .replace(/(<img\b[^>]*\bsrc=)(["'])([^"']+)\2/gi,
                (_, p, q, u) => `${p}${q}${absolutize(u, IMAGE_BASE)}${q}`)
              .replace(/(<a\b[^>]*\bhref=)(["'])([^"']+)\2/gi,
                (_, p, q, u) => `${p}${q}${absolutize(u, LINK_BASE)}${q}`)
              .replace(/(!\[[^\]]*\]\()([^\s)]+)(\s+"[^"]*")?(\))/g,
                (_, p, u, t, e) => `${p}${absolutize(u, IMAGE_BASE)}${t || ''}${e}`)
              .replace(/(?<!!)(\[[^\]]*\]\()([^\s)]+)(\s+"[^"]*")?(\))/g,
                (_, p, u, t, e) => `${p}${absolutize(u, LINK_BASE)}${t || ''}${e}`);

            fs.writeFileSync('README.md', content);

            // Resize the mod icon to exactly 256x256 (Thunderstore requirement).
            const iconPath = process.env.ICON_PATH;
            if (fs.existsSync(iconPath)) {
              const buffer = await sharp(iconPath).resize(256, 256, {fit: 'cover'}).toBuffer();
              fs.writeFileSync(iconPath, buffer);
              console.log(`Resized ${iconPath} to 256x256`);
            } else {
              console.warn(`Icon not found at ${iconPath}, skipping resize`);
            }
        run: |
          npm install --no-save --silent sharp
          node --input-type=module <<<"$SCRIPT"
          cat README.md

      - name: Build Thunderstore Package
        working-directory: ${{ env.PROJECT_NAME }}
        run: |
          tcli build --package-version "$RELEASE_TAG" | tee tcli.log
          sed -i 's|\x1B\[[0-9;]*m||g' tcli.log # get rid of ansi colors
          path=$(grep '^Output path ' tcli.log | sed 's|^Output path ||')
          if [ -z "$path" ]; then
            echo "tcli build did not produce an Output path" >&2
            exit 1
          fi
          echo "THUNDERSTORE_PACKAGE_PATH=$path" >> "$GITHUB_ENV"
          name=$(basename "$path")
          echo "THUNDERSTORE_PACKAGE_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload Thunderstore Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.THUNDERSTORE_PACKAGE_NAME }}
          path: ${{ env.THUNDERSTORE_PACKAGE_PATH }}

      # Before Thunderstore, so a release that fails late never leaves a package without its GitHub release. A tag made
      # here goes on the commit the DLL was built from; the checks made sure an existing tag is on that commit too.
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.PROJECT_NAME }}/bin/Release/${{ env.DLL_NAME }}
          body: |
            ${{ steps.changelog_read.outputs.changes || steps.changelog_rotate.outputs.release-notes || env.RELEASE_DESC }}

            ---
            ${{ needs.build.outputs.built-with }}
          fail_on_unmatched_files: true
          draft: ${{ env.ACT == 'true' }}

      # A step's if can't see its own env, so this step finds out whether there is a token, without passing it on
      - name: Check for a Thunderstore token
        id: thunderstore_token
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -n "$TCLI_AUTH_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No TCLI_AUTH_TOKEN secret, so the package isn't published to Thunderstore; upload it by hand"
          fi

      - name: Publish Thunderstore Package
        if: steps.thunderstore_token.outputs.set == 'true' && env.ACT != 'true'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        working-directory: ${{ env.PROJECT_NAME }}
        run: tcli publish --file "$THUNDERSTORE_PACKAGE_PATH"
