# Saves every new Boss Bloon Event from Ninja Kiwi's Open Data API to data/boss-events/ (#144), then publishes
# boss-events.json on GitHub Pages. Ninja Kiwi's API only keeps the last few events, so this runs every day: a run that
# fails is caught up by the next one, long before an event drops off the list. A failing run sends the normal Actions
# e-mail. See data/boss-events/README.md. Not generated by Mod Helper, so changes are kept.
name: Boss events

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

# One run at a time, so two runs never commit the same event
concurrency:
  group: boss-events
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch new events
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.archive.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Save the events the archive doesn't have yet
        id: archive
        run: node tools/boss-events/archive.mjs

      - name: Collect the new files
        if: steps.archive.outputs.names != ''
        run: |
          mkdir new-events
          git ls-files --others --exclude-standard -z data/boss-events | xargs -0 -I{} cp {} new-events/

      - uses: actions/upload-artifact@v7
        if: steps.archive.outputs.names != ''
        with:
          name: new-events
          path: new-events/
          if-no-files-found: error
          retention-days: 7

  # The only job that can write to the repository, and it runs no code from the API's answers
  commit:
    name: Commit
    needs: fetch
    if: needs.fetch.outputs.names != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/download-artifact@v8
        with:
          name: new-events
          path: new-events/

      - name: Commit and push the new files
        id: push
        env:
          NAMES: ${{ needs.fetch.outputs.names }}
        run: |
          # Never change a file the archive already has
          for file in new-events/*.json; do
            target="data/boss-events/$(basename "$file")"
            if [ -e "$target" ]; then echo "$target is already archived, kept"; else cp "$file" "$target"; fi
          done
          git add data/boss-events
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Archive boss events: $NAMES"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push with this workflow's token doesn't start pages.yml, so it is called here. Also run by hand, to publish again.
  deploy:
    name: Publish boss-events.json
    needs: [fetch, commit]
    if: >-
      !cancelled() && needs.fetch.result == 'success'
      && (needs.commit.result == 'success'
        || (needs.commit.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.commit.outputs.sha || 'master' }}
