# Checks that don't need the game. The in-game tests (see CONTRIBUTING.md) still have to be run locally.
# build.yml runs these checks first for a release (a tag, or a run by hand with a tag) and only builds, publishes and
# releases when they pass, so tags aren't checked here a second time.
name: Checks

on:
  push:
    # '**' also matches branch names with a /, which '*' doesn't
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'The version being released, which the Release version job checks'
        required: false
        type: string

permissions:
  contents: read

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every translation against English.json
        shell: pwsh
        run: ./.github/scripts/Check-Localization.ps1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the logic that runs without the game
        run: dotnet test --project UnitTests

  property-tests:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test share codes with random setups and broken codes
        run: dotnet test --project PropertyTests

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Test that the website reads codes like the mod
        run: npm test

      - name: Build the website
        run: npm run build

  boss-events:
    name: Boss events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the boss events backfill and archiver on saved samples
        run: node --test "tools/boss-events/*.test.mjs"

  release:
    name: Release version
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every branch and tag, to see where the commit and the tag are
          fetch-depth: 0

      # Only reviewed code is released, and the tag says which commit the DLL was built from (#177)
      - name: Check that the commit is on the default branch and the tag on the commit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::The default branch isn't known for this event"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_SHA isn't on $DEFAULT_BRANCH; only a commit on $DEFAULT_BRANCH can be released"
            exit 1
          fi
          tagged=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG is on $tagged, but this run builds $GITHUB_SHA"
            exit 1
          fi

      - name: Check the tag against ModHelperData.cs, CHANGELOG.md and the in-game test report
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./.github/scripts/Check-Release.ps1 -Tag "$env:TAG"
