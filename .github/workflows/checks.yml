# Checks that don't need the game. The in-game tests (see CONTRIBUTING.md) still have to be run locally.
# This file is not generated by Mod Helper, unlike build.yml, so changes here are kept.
name: Checks

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check every translation against English.json
        shell: pwsh
        run: ./.github/scripts/Check-Localization.ps1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the logic that runs without the game
        run: dotnet test --project UnitTests

  property-tests:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test share codes with random setups and broken codes
        run: dotnet test --project PropertyTests

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Test that the website reads codes like the mod
        run: npm test

      - name: Build the website
        run: npm run build

  release:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against ModHelperData.cs and CHANGELOG.md
        shell: pwsh
        run: ./.github/scripts/Check-Release.ps1 -Tag "${{ github.ref_name }}"
