# Checks that don't need the game. The in-game tests (see CONTRIBUTING.md) still have to be run locally.
# build.yml runs these checks first for a release (a tag, or a run by hand with a tag) and only builds, publishes and
# releases when they pass, so tags aren't checked here a second time.
name: Checks

on:
  push:
    # '**' also matches branch names with a /, which '*' doesn't
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'The version being released, which the Release version job checks'
        required: false
        type: string

permissions:
  contents: read

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every translation against English.json
        shell: pwsh
        run: ./.github/scripts/Check-Localization.ps1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the logic that runs without the game
        run: dotnet test --project UnitTests

  property-tests:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test share codes with random setups and broken codes
        run: dotnet test --project PropertyTests

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Test that the website reads codes like the mod
        run: npm test

      - name: Build the website
        run: npm run build

  boss-events:
    name: Boss events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the boss events backfill on saved samples
        run: node --test "tools/boss-events/*.test.mjs"

  release:
    name: Release version
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against ModHelperData.cs, CHANGELOG.md and the in-game test report
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./.github/scripts/Check-Release.ps1 -Tag "$env:TAG"
